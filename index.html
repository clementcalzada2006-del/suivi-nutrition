<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suivi nutrition</title>
  <meta name="description" content="Suivi calorique et nutritionnel du jour : calories, macros, vitamines, minéraux, oméga, dépense et poids. Tout reste sur l'appareil.">
  <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nutrition">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="bandeau-stockage" class="bandeau" role="alert" hidden>Stockage indisponible : tes ajouts seront perdus à la fermeture.</div>

  <!-- Total du jour, toujours visible -->
  <header id="entete" class="entete" aria-label="Total du jour">
    <div class="entete-kcal">
      <span id="e-kcal" class="kcal" data-total="0">0</span>
      <span class="kcal-unite">kcal</span>
      <span id="e-depense" class="kcal-depense"></span>
      <button id="e-incomplet" class="marque-incomplet" data-act="onglet" data-onglet="bilan" hidden>incomplet</button>
    </div>
    <div class="entete-macros">
      <div class="macro m-prot"><span class="macro-val" id="e-proteines" data-total="0">0,0</span><span class="macro-nom">Protéines</span></div>
      <div class="macro m-gluc"><span class="macro-val" id="e-glucides" data-total="0">0,0</span><span class="macro-nom">Glucides</span></div>
      <div class="macro m-lip"><span class="macro-val" id="e-lipides" data-total="0">0,0</span><span class="macro-nom">Lipides</span></div>
    </div>
  </header>

  <main id="app">
    <p class="chargement">Chargement…</p>
    <section id="vue-aliments" class="vue" aria-label="Aliments" hidden></section>
    <section id="vue-journal" class="vue" aria-label="Journal du jour" hidden></section>
    <section id="vue-bilan" class="vue" aria-label="Bilan du jour" hidden></section>
    <section id="vue-activite" class="vue" aria-label="Activité" hidden></section>
    <section id="vue-poids" class="vue" aria-label="Poids" hidden></section>
  </main>

  <nav class="onglets" aria-label="Onglets">
    <!-- Icônes dessinées à la main (trait de 1,6), sans bibliothèque externe -->
    <button data-act="onglet" data-onglet="aliments"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.2 1.2-3 3.6-3 6.5V13h3"/></svg>Aliments</button>
    <button data-act="onglet" data-onglet="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8.5h6M9 12h6M9 15.5h4"/></svg>Journal</button>
    <button data-act="onglet" data-onglet="bilan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>Bilan</button>
    <button data-act="onglet" data-onglet="activite"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="4.5" r="1.8"/><path d="M9 21l2.5-6 2.5 2.5V21M8 11.5l3-3.5 3 1.5 2 3M11.5 8l-1.5 7"/></svg>Activité</button>
    <button data-act="onglet" data-onglet="poids"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8.5 9a5 5 0 0 1 7 0M12 9.5l1.5-2"/></svg>Poids</button>
  </nav>

  <div id="voile" class="voile" data-act="fermer" hidden></div>
  <div id="feuille" class="feuille" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="chargement">Cette application a besoin de JavaScript.</p></noscript>
</body>
</html>
